<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Operações GLPI · Prefeitura de Araraquara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --p:#00D9C0; --s:#5B7FDE; --a:#E85D9A;
  --dk:#0A0E27; --dkr:#050711; --lt:#F8F9FA;
  --mut:rgba(248,249,250,.6); --brd:rgba(255,255,255,.09);
  --g1:linear-gradient(135deg,#00D9C0 0%,#5B7FDE 100%);
  --g2:linear-gradient(135deg,#E85D9A 0%,#FF9A6C 100%);
  --glass:rgba(255,255,255,.04);
  --ok:#3ddc97; --warn:#FFB454; --err:#ff6b81; --info:#5B7FDE;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--dkr);color:var(--lt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
.gradtext{background:var(--g1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}

/* blobs */
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;z-index:0;pointer-events:none;animation:float 18s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.1)}66%{transform:translate(-30px,20px) scale(.95)}}

/* ===== LOGIN ===== */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(5,7,17,.85),rgba(10,14,39,.7)),url('Background_GLPI.jpeg') center/cover no-repeat;}
.login-card{width:400px;max-width:92vw;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--brd);border-radius:20px;padding:38px 34px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.login-card .brasao{display:block;height:64px;margin:0 auto 14px}
.login-card h1{text-align:center;font-size:26px;font-weight:800;letter-spacing:-.5px}
.login-card .sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;font-weight:500}
.inp{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--brd);border-radius:10px;padding:11px 13px;color:var(--lt);transition:.3s}
.inp:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(0,217,192,.12)}
.pwwrap{position:relative}
.pwwrap .toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:18px}
.row-between{display:flex;align-items:center;justify-content:space-between}
.check{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 16px;font-weight:600;transition:.3s}
.btn:hover{transform:translateY(-2px)}
.btn-grad{background:var(--g1);color:#04121a;width:100%;font-weight:700;box-shadow:0 8px 24px rgba(0,217,192,.18)}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid var(--brd);width:100%}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
.divider{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:11px;margin:16px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--brd)}
.linkmut{color:var(--mut);font-size:12px;text-align:center;display:block;margin-top:14px}
.linkmut:hover{color:var(--p)}
.login-foot{text-align:center;color:var(--mut);font-size:11px;margin-top:18px}

/* ===== APP SHELL ===== */
#app{display:none;min-height:100vh;flex-direction:column}
header.top{position:sticky;top:0;z-index:50;height:60px;display:flex;align-items:center;gap:16px;padding:0 18px;background:rgba(10,14,39,.7);backdrop-filter:blur(20px);border-bottom:1px solid var(--brd)}
header.top .brasao{height:40px}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);margin-left:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.5)}70%{box-shadow:0 0 0 9px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:20px;position:relative;transition:.3s}
.iconbtn:hover{background:rgba(255,255,255,.06);color:var(--lt)}
.nbadge{position:absolute;top:5px;right:5px;background:var(--a);color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:1px 5px;min-width:15px;text-align:center}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--g1);color:#04121a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer}
.viewas-banner{background:rgba(232,93,154,.14);border-bottom:1px solid rgba(232,93,154,.3);color:#ffd0e4;font-size:12px;padding:6px 18px;display:flex;align-items:center;gap:8px}
.shell{flex:1;display:flex;min-height:0}
aside.side{width:248px;flex-shrink:0;background:rgba(10,14,39,.45);border-right:1px solid var(--brd);padding:14px 10px;overflow-y:auto;transition:.3s}
aside.side.collapsed{width:64px}
.side .grp{font-size:10px;letter-spacing:1px;color:var(--mut);text-transform:uppercase;margin:14px 10px 6px;font-weight:600}
.navi{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--mut);font-size:13.5px;font-weight:500;cursor:pointer;transition:.2s;white-space:nowrap}
.navi i{font-size:19px;flex-shrink:0}
.navi:hover{background:rgba(255,255,255,.05);color:var(--lt)}
.navi.active{background:rgba(0,217,192,.12);color:var(--p)}
.navi.active i{color:var(--p)}
.side.collapsed .navi span,.side.collapsed .grp{display:none}
main.content{flex:1;overflow-y:auto;padding:22px 26px;min-width:0;display:flex;flex-direction:column}
.view{flex:1}
footer.foot{margin-top:26px;padding:14px 0 4px;border-top:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:12px;flex-wrap:wrap;gap:8px}

/* ===== COMPONENTS ===== */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{font-size:23px;font-weight:700;letter-spacing:-.4px}
.page-head p{color:var(--mut);font-size:13px;margin-top:2px}
.card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--brd);border-radius:16px;padding:18px}
.card.sm{border-radius:12px;padding:15px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
.metric{position:relative;overflow:hidden}
.metric .ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
.metric .v{font-size:30px;font-weight:800;letter-spacing:-1px}
.metric .l{color:var(--mut);font-size:12.5px;margin-top:2px}
.metric .trend{font-size:11px;margin-top:8px;display:inline-flex;gap:4px;align-items:center}
.up{color:var(--ok)} .down{color:var(--err)}
.hero{position:relative;border-radius:20px;overflow:hidden;padding:30px;border:1px solid var(--brd);margin-bottom:20px;
  background:linear-gradient(135deg,rgba(5,7,17,.82),rgba(10,14,39,.6)),url('Background_GLPI.jpeg') center/cover}
.hero h1{font-size:26px;font-weight:800}
.hero p{color:rgba(248,249,250,.8);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid var(--brd);color:var(--mut)}
.chip.active{background:rgba(0,217,192,.14);border-color:rgba(0,217,192,.3);color:var(--p)}
.seg{display:inline-flex;background:rgba(255,255,255,.05);border:1px solid var(--brd);border-radius:10px;padding:3px}
.seg button{padding:6px 13px;border-radius:8px;font-size:12.5px;color:var(--mut);font-weight:500}
.seg button.on{background:var(--g1);color:#04121a;font-weight:700}
.badge{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.b-teal{background:rgba(0,217,192,.14);color:var(--p)}
.b-blue{background:rgba(91,127,222,.16);color:#9db4ff}
.b-pink{background:rgba(232,93,154,.16);color:#ff9ec5}
.b-amber{background:rgba(255,180,84,.16);color:var(--warn)}
.b-red{background:rgba(255,107,129,.16);color:var(--err)}
.b-grey{background:rgba(255,255,255,.08);color:var(--mut)}
.b-green{background:rgba(61,220,151,.16);color:var(--ok)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--brd)}
td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;vertical-align:middle}
tbody tr{transition:.2s}
tbody tr:hover{background:rgba(255,255,255,.03)}
.tbl-wrap{overflow-x:auto;border-radius:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--brd);border-radius:10px;padding:8px 12px;flex:1;min-width:200px}
.search input{background:none;border:none;color:var(--lt);outline:none;width:100%}
.search i{color:var(--mut)}
select.inp{appearance:none;cursor:pointer}
.linklike{color:var(--p);cursor:pointer;font-weight:600}
.linklike:hover{text-decoration:underline}
.actions-cell{display:flex;gap:4px}
.actions-cell .iconbtn{width:30px;height:30px;font-size:17px;border-radius:8px}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;align-items:start}
@media(max-width:1300px){.kanban{grid-template-columns:repeat(2,1fr)}}
.kcol{background:rgba(255,255,255,.03);border:1px solid var(--brd);border-radius:14px;padding:11px;min-height:120px}
.kcol.drag{border-color:var(--p);background:rgba(0,217,192,.06)}
.kcol h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);display:flex;justify-content:space-between;margin-bottom:10px;padding:0 3px}
.kcard{background:var(--glass);border:1px solid var(--brd);border-radius:11px;padding:11px;margin-bottom:9px;cursor:grab;position:relative;overflow:hidden;transition:.2s}
.kcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.kcard .slabar{position:absolute;left:0;top:0;bottom:0;width:3px}
.kcard .kid{font-size:11px;color:var(--mut)}
.kcard .kt{font-weight:600;font-size:13px;margin:3px 0 7px}
.kcard .kmeta{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut)}

/* chat */
.chatwrap{display:grid;grid-template-columns:35% 65%;gap:0;height:calc(100vh - 220px);min-height:480px;border:1px solid var(--brd);border-radius:16px;overflow:hidden}
.convlist{border-right:1px solid var(--brd);display:flex;flex-direction:column;background:rgba(255,255,255,.02)}
.convlist .lh{padding:12px;border-bottom:1px solid var(--brd)}
.convlist .scroller{overflow-y:auto;flex:1}
.convitem{display:flex;gap:10px;padding:12px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;border-left:3px solid transparent;transition:.2s}
.convitem:hover{background:rgba(255,255,255,.03)}
.convitem.sel{border-left-color:var(--p);background:rgba(0,217,192,.06)}
.cav{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#04121a}
.convitem .cmain{flex:1;min-width:0}
.convitem .crow{display:flex;justify-content:space-between;gap:6px}
.convitem .cname{font-weight:600;font-size:13.5px}
.convitem .ctime{font-size:11px;color:var(--mut);white-space:nowrap}
.convitem .csec{font-size:11px;color:var(--mut)}
.convitem .cprev{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.convitem .ctags{display:flex;gap:5px;margin-top:5px;align-items:center}
.thread{display:flex;flex-direction:column;min-width:0}
.thread .th{padding:13px 16px;border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.thread .msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:11px;
  background:radial-gradient(circle at 30% 10%,rgba(91,127,222,.05),transparent 60%)}
.bubble{max-width:74%;padding:9px 13px;border-radius:14px;font-size:13.5px;position:relative}
.bubble .bt{font-size:9.5px;color:var(--mut);margin-top:5px;text-align:right}
.bubble .who{font-size:10.5px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.b-user{align-self:flex-end;background:rgba(0,217,192,.12);border:1px solid rgba(0,217,192,.25)}
.b-ai{align-self:flex-start;background:linear-gradient(135deg,rgba(0,217,192,.18),rgba(91,127,222,.18));border:1px solid rgba(91,127,222,.22)}
.b-ai .who{color:var(--p)}
.b-tec{align-self:flex-start;background:rgba(232,93,154,.12);border:1px solid rgba(232,93,154,.25)}
.b-tec .who{color:#ff9ec5}
.sysmsg{align-self:center;font-size:11.5px;padding:5px 13px;border-radius:20px;font-weight:600;text-align:center;max-width:85%}
.audio{display:flex;align-items:center;gap:9px}
.wave{display:flex;align-items:center;gap:2px;height:22px}
.wave i{width:2.5px;background:currentColor;border-radius:2px;opacity:.7}
.playbtn{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.transcript{font-size:11.5px;color:var(--mut);font-style:italic;margin-top:5px}
.composer{padding:11px 14px;border-top:1px solid var(--brd);display:flex;gap:9px;align-items:center}
.composer input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--brd);border-radius:22px;padding:10px 15px;color:var(--lt);outline:none}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--brd)}
.tlitem{position:relative;padding:0 0 18px}
.tlitem .tdot{position:absolute;left:-26px;top:1px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#04121a}
.tlitem .tx{font-size:13.5px}
.tlitem .tm{font-size:11px;color:var(--mut);margin-top:2px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(2,4,12,.7);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:520px;max-width:94vw;max-height:90vh;overflow-y:auto;background:#0b1026;border:1px solid var(--brd);border-radius:18px;padding:24px;box-shadow:0 40px 100px rgba(0,0,0,.6)}
.modal.wide{width:720px}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.modal h3{font-size:19px;font-weight:700}
.modal .msub{color:var(--mut);font-size:12.5px}
.side-modal{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:96vw;background:#0b1026;border-left:1px solid var(--brd);z-index:200;overflow-y:auto;padding:22px;box-shadow:-30px 0 80px rgba(0,0,0,.5);animation:slidein .3s ease}
@keyframes slidein{from{transform:translateX(100%)}to{transform:translateX(0)}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.kv .k{color:var(--mut)}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.btn-line{border:1px solid var(--brd);background:rgba(255,255,255,.04)}
.btn-pink{background:var(--g2);color:#2a0a18;font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--brd);margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:9px 14px;color:var(--mut);font-weight:500;font-size:13px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--p);border-bottom-color:var(--p)}
.permgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.permrow{display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(255,255,255,.03);border-radius:9px;font-size:12.5px}
.sw{position:relative;width:34px;height:19px;background:rgba(255,255,255,.15);border-radius:20px;flex-shrink:0;cursor:pointer;transition:.3s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.3s}
.sw.on{background:var(--p)}.sw.on::after{left:17px}
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{background:#0b1026;border:1px solid var(--brd);border-left:3px solid var(--p);border-radius:11px;padding:12px 15px;min-width:240px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:slidein .25s ease}
.toast i{font-size:19px;color:var(--p)}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
.empty i{font-size:42px;opacity:.5;display:block;margin-bottom:10px}
.pwbar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.pwbar i{display:block;height:100%;transition:.3s}
.miniwrap{height:42px}
.statbig{font-size:34px;font-weight:800;letter-spacing:-1px}
.flex{display:flex} .ic-gap{gap:10px} .center{align-items:center} .wrap{flex-wrap:wrap}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb12{margin-bottom:12px}
.muted{color:var(--mut)}
.barh{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.barh i{display:block;height:100%;background:var(--g1)}
</style>
</head>
<body>
<div class="blob" style="width:380px;height:380px;background:var(--p);top:-100px;left:-80px"></div>
<div class="blob" style="width:340px;height:340px;background:var(--a);bottom:-120px;right:-60px;animation-delay:-6s"></div>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="login-card">
    <img class="brasao" src="BrasaoAraraquara.png" alt="Brasão de Araraquara">
    <h1>Central GLPI</h1>
    <div class="sub">Prefeitura Municipal de Araraquara</div>
    <div class="field">
      <label>E-mail institucional</label>
      <input id="lgEmail" class="inp" type="email" placeholder="usuario@araraquara.sp.gov.br" value="fabricio@araraquara.sp.gov.br">
    </div>
    <div class="field">
      <label>Senha</label>
      <div class="pwwrap">
        <input id="lgPass" class="inp" type="password" placeholder="••••••••" value="demo">
        <i class="ti ti-eye toggle" onclick="togglePw('lgPass',this)"></i>
      </div>
    </div>
    <div class="row-between" style="margin:4px 0 16px">
      <label class="check"><input type="checkbox" checked> Manter conectado</label>
      <a class="linkmut" style="margin:0" onclick="openForgot()">Esqueci minha senha</a>

function doLogin(sso){
 const email=document.getElementById('lgEmail').value.trim().toLowerCase();
 const err=document.getElementById('lgErr');
 if(STATE.blockedUntil&&Date.now()<STATE.blockedUntil){err.textContent='Conta bloqueada por 5 minutos após várias tentativas.';err.classList.remove('hidden');return}
 const valid=/^[^@\s]+@araraquara\.sp\.gov\.br$/.test(email);
 const known=STATE.users.find(u=>u.email===email);
 if(!valid){STATE.loginAttempts++;if(STATE.loginAttempts>=3){STATE.blockedUntil=Date.now()+300000;err.textContent='Conta bloqueada por 5 minutos após 3 tentativas.';}else{err.textContent='E-mail inválido. Use o domínio @araraquara.sp.gov.br ('+(3-STATE.loginAttempts)+' tentativas restantes).';}err.classList.remove('hidden');return}
 STATE.loginAttempts=0;err.classList.add('hidden');
 STATE.currentUser=known||{id:99,nome:email.split('@')[0],email,profile:'tecnico',sector:'TI',status:'ativo',primeiro_acesso:false};
 STATE.viewAs=null;
 document.getElementById('login').style.display='none';
 document.getElementById('app').style.display='flex';
 buildShell();navigate('overview');startClock();startLive();
 if(STATE.currentUser.primeiro_acesso){setTimeout(openChangePass,400)}
 toast((sso?'Login via AD: ':'Bem-vindo, ')+STATE.currentUser.nome);
}

     side.insertAdjacentHTML('beforeend',`<div class="navi" data-id="${it.id}" onclick="navigate('${it.id}')"><i class="ti ${it.i}"></i><span>${it.t}</span></div>`);

function convItem(c){const last=c.msgs[c.msgs.length-1];const prev=last.audio?'🎤 Áudio':last.text.split('\n')[0].slice(0,46);
 return `<div class="convitem ${c.id===selectedConv?'sel':''}" data-id="${c.id}" data-s="${(c.nome+c.sector+c.msgs.map(m=>m.text).join(' ')).toLowerCase()}" data-canal="${c.canal}" data-hum="${c.humano}" onclick="selectConv(${c.id})">

function convChip(el,c){el.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');
 document.querySelectorAll('.convitem').forEach(x=>{let show=true;if(c==='Com técnico')show=x.dataset.hum==='true';else if(c!=='Todos')show=x.dataset.canal===c;x.style.display=show?'':'none'})}
function threadHtml(c){if(!c)return '<div class="empty"><i class="ti ti-message-2"></i>Selecione uma conversa</div>';
 const ro=effectiveProfile()==='auditor';
 return `<div class="th"><div><div style="font-weight:600;font-size:15px">${c.nome}</div><div class="muted" style="font-size:12px">${c.sector} · ${c.canal} ${c.ticket?`· <span class="linklike" onclick="openTicket(${c.ticket})">#${c.ticket}</span>`:''}</div>
   <div class="flex wrap mt8" style="gap:6px">${c.ticket?`<span class="badge ${STBADGE[STATE.tickets.find(t=>t.id===c.ticket)?.status||'resolvido']}">${STLABEL[STATE.tickets.find(t=>t.id===c.ticket)?.status||'resolvido']}</span>`:''}<span class="badge ${c.humano?'b-pink':'b-teal'}">${c.humano?'Técnico ativo':'Agente IA'}</span></div></div>
   <div class="flex ic-gap">${!ro&&can('assume')?`<button class="btn btn-line btn-sm" onclick="toast('Conversa assumida por '+STATE.currentUser.nome.split(' ')[0])"><i class="ti ti-hand-grab"></i> Assumir</button>`:''}${!ro?`<button class="btn btn-line btn-sm" onclick="toast('Atendimento encerrado (simulado)')"><i class="ti ti-circle-x"></i></button>`:''}</div></div>
  <div class="msgs">${c.msgs.map(bubble).join('')}</div>
  <div class="composer">${ro?'<span class="muted" style="margin:auto">Modo somente leitura — Auditor não pode responder</span>':`<input placeholder="Digite uma mensagem..." onkeydown="if(event.key==='Enter'&&this.value){toast('Mensagem enviada (simulado)');this.value=''}"><button class="iconbtn" style="background:var(--g1);color:#04121a" onclick="toast('Mensagem enviada (simulado)')"><i class="ti ti-send"></i></button>`}</div>`}
function bubble(m){
 if(m.from==='sys'){const cmap={teal:'b-teal',blue:'b-blue',grad:'b-teal',pink:'b-pink',amber:'b-amber'};return `<div class="sysmsg ${cmap[m.color]||'b-grey'}" ${m.color==='grad'?'style="background:linear-gradient(135deg,rgba(0,217,192,.18),rgba(91,127,222,.18));color:#bff7ee"':''}>${m.text} · <span class="mono" style="opacity:.7">${m.time}</span></div>`}
 let cls=m.from==='user'?'b-user':m.from==='ai'?'b-ai':'b-tec';
 let who=m.from==='ai'?'<div class="who"><i class="ti ti-robot"></i> Agente IA</div>':m.from==='tec'?`<div class="who"><i class="ti ti-user"></i> ${m.name} · Técnico</div>`:'';
 let body;
 if(m.audio){body=`<div class="audio"><div class="playbtn"><i class="ti ti-player-play-filled"></i></div><div class="wave">${Array.from({length:26}).map(()=>`<i style="height:${4+Math.random()*18}px"></i>`).join('')}</div><span class="mono" style="font-size:11px">${m.audio.dur}</span></div>${m.audio.transcript?`<div class="transcript">transcrito: "${m.audio.transcript}"</div>`:''}`}
 else body=m.text.replace(/\n/g,'<br>');
 return `<div class="bubble ${cls}">${who}${body}<div class="bt mono">${m.time}</div></div>`}

 </tbody></table></div>`;

function filterRes(id,r){document.querySelectorAll('#'+id+' tbody tr').forEach(x=>x.style.display=(!r||x.dataset.res===r)?'':'none')}

/* ===================== MODALS ===================== */
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">${html.includes('side-modal')?html:html}</div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openForgot(){modal(`<div class="modal"><div class="mh"><h3>Esqueci minha senha</h3><button class="iconbtn" onclick="closeModal()"><i class="ti ti-x"></i></button></div><p class="muted mb12">Informe seu e-mail institucional para receber o link de redefinição.</p><div class="field"><input class="inp" placeholder="usuario@araraquara.sp.gov.br"></div><div class="btnrow"><button class="btn btn-grad" onclick="closeModal();toast('Se o e-mail estiver cadastrado, enviamos as instruções.')">Enviar link de redefinição</button></div></div>`)}
function openChangePass(){modal(`<div class="modal"><div class="mh"><div><h3>${STATE.currentUser?.primeiro_acesso?'Primeiro acesso — defina uma nova senha':'Trocar senha'}</h3><div class="msub">Mínimo 12 caracteres, com maiúscula, número e símbolo</div></div>${STATE.currentUser?.primeiro_acesso?'':'<button class="iconbtn" onclick="closeModal()"><i class="ti ti-x"></i></button>'}</div>
 ${STATE.currentUser?.primeiro_acesso?'':'<div class="field"><label>Senha atual</label><input class="inp" type="password"></div>'}
 <div class="field"><label>Nova senha</label><input class="inp" type="password" id="npw" oninput="pwStrength(this.value)"></div>
 <div class="pwbar"><i id="pwfill" style="width:0%;background:var(--err)"></i></div><div class="muted mt8" id="pwtxt" style="font-size:12px">Força: —</div>
 <div class="field mt16"><label>Confirmar nova senha</label><input class="inp" type="password"></div>
 <div class="btnrow"><button class="btn btn-grad" onclick="if(STATE.currentUser)STATE.currentUser.primeiro_acesso=false;toast('Senha alterada com sucesso');closeModal()">Salvar nova senha</button></div></div>`)}
function pwStrength(v){let s=0;if(v.length>=12)s++;if(/[A-Z]/.test(v))s++;if(/[0-9]/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;
 const f=document.getElementById('pwfill'),t=document.getElementById('pwtxt');const map=[['0%','var(--err)','—'],['33%','var(--err)','Fraca'],['66%','var(--warn)','Média'],['85%','var(--warn)','Boa'],['100%','var(--ok)','Forte']];
 const m=map[s];f.style.width=m[0];f.style.background=m[1];t.textContent='Força: '+m[2]}

/* ===================== UTIL ===================== */
function toast(msg){const w=document.getElementById('toasts');const el=document.createElement('div');el.className='toast';el.innerHTML=`<i class="ti ti-circle-check"></i><span>${msg}</span>`;w.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='.4s';setTimeout(()=>el.remove(),400)},3200)}
function logOp(acao,delta){STATE.operationLogs.unshift({d:new Date(),user:STATE.currentUser.nome,profile:PROFILES[STATE.currentUser.profile].name,acao,delta,ip:'10.10.2.14'})}
function startClock(){const c=document.getElementById('clock');const t=new Date(NOW);setInterval(()=>{t.setSeconds(t.getSeconds()+1);c.textContent=fmtDate(t).split(' ')[1]+':'+pad(t.getSeconds())},1000);c.textContent=fmtDate(t).split(' ')[1]+':00'}

document.getElementById('lgPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
</script>
